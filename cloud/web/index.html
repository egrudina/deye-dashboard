<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Інвертор</title>
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header class="top">
      <h1>Інвертор</h1>
      <span id="freshness" class="muted"></span>
    </header>

    <section id="status" class="card status" aria-live="polite">
      <div class="status-line"><span id="status-icon" aria-hidden="true"></span><strong id="status-text">Завантаження…</strong></div>
      <div id="status-since" class="secondary"></div>
    </section>

    <section class="tiles">
      <div class="card tile"><div class="tile-label">Батарея</div><div class="tile-value" id="t-soc">—</div><div class="tile-sub" id="t-batt"></div></div>
      <div class="card tile"><div class="tile-label">Споживання</div><div class="tile-value" id="t-load">—</div><div class="tile-sub" id="t-phases"></div></div>
      <div class="card tile"><div class="tile-label">Сонце</div><div class="tile-value" id="t-pv">—</div><div class="tile-sub" id="t-pv-sub"></div></div>
      <div class="card tile"><div class="tile-label">Мережа</div><div class="tile-value" id="t-grid">—</div><div class="tile-sub" id="t-grid-sub"></div></div>
    </section>

    <section class="card">
      <div class="chart-head">
        <h2>Графіки</h2>
        <div class="seg" role="group" aria-label="Період">
          <button data-range="day" aria-pressed="true">Доба</button>
          <button data-range="week" aria-pressed="false">Тиждень</button>
          <button data-range="month" aria-pressed="false">Місяць</button>
        </div>
      </div>
      <h3>Потужність, Вт</h3>
      <div class="legend" id="legend-power"></div>
      <div class="chart" id="chart-power"></div>
      <h3>Заряд батареї, %</h3>
      <div class="chart chart-small" id="chart-soc"></div>
      <p class="muted note"><span class="swatch-off"></span> сірим позначено час без світла. Батарея: «+» розряд, «−» заряд.</p>
      <details>
        <summary>Таблиця</summary>
        <div class="table-wrap"><table id="table"><thead><tr><th>Час</th><th>Споживання</th><th>Сонце</th><th>Батарея</th><th>Заряд</th><th>Світло</th></tr></thead><tbody></tbody></table></div>
      </details>
    </section>

    <section class="card">
      <h2>Відключення</h2>
      <ul id="outages" class="outages"><li class="muted">Завантаження…</li></ul>
    </section>

    <section class="card">
      <h2>Стан системи</h2>
      <dl id="health" class="health"></dl>
    </section>
  </main>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
