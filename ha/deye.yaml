# Deye inverter from the cloud dashboard (generated by ha/make_package.py; see docs/home-assistant.md).
rest:
  - resource: !secret deye_api_url  # https://<your host>/api/ha
    scan_interval: 60
    timeout: 20
    headers:
      CF-Access-Client-Id: !secret deye_access_client_id
      CF-Access-Client-Secret: !secret deye_access_client_secret
    binary_sensor:
      - name: "Deye світло"
        unique_id: deye_grid_on
        value_template: "{{ value_json.grid_on }}"
        device_class: power
      - name: "Deye відключення триває"
        unique_id: deye_outage_in_progress
        value_template: "{{ value_json.outage_in_progress }}"
        device_class: problem
    sensor:
      - name: "Deye Батарея"
        unique_id: deye_soc
        value_template: "{{ value_json.soc }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: "Deye Батарея потужність"
        unique_id: deye_battery_w
        value_template: "{{ value_json.battery_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Deye Батарея заряд"
        unique_id: deye_battery_charge_w
        value_template: "{{ value_json.battery_charge_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Deye Батарея розряд"
        unique_id: deye_battery_discharge_w
        value_template: "{{ value_json.battery_discharge_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Deye Споживання"
        unique_id: deye_load_w
        value_template: "{{ value_json.load_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Deye Споживання фаза A"
        unique_id: deye_load_a_w
        value_template: "{{ value_json.load_a_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Deye Споживання фаза B"
        unique_id: deye_load_b_w
        value_template: "{{ value_json.load_b_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Deye Споживання фаза C"
        unique_id: deye_load_c_w
        value_template: "{{ value_json.load_c_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Deye Сонце"
        unique_id: deye_pv_w
        value_template: "{{ value_json.pv_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Deye З мережі"
        unique_id: deye_grid_w
        value_template: "{{ value_json.grid_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Deye Власне споживання інвертора"
        unique_id: deye_inverter_overhead_w
        value_template: "{{ value_json.inverter_overhead_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Deye Напруга A"
        unique_id: deye_grid_v_a
        value_template: "{{ value_json.grid_v_a }}"
        availability: "{{ value_json is defined and value_json.grid_v_a is not none }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
      - name: "Deye Напруга B"
        unique_id: deye_grid_v_b
        value_template: "{{ value_json.grid_v_b }}"
        availability: "{{ value_json is defined and value_json.grid_v_b is not none }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
      - name: "Deye Напруга C"
        unique_id: deye_grid_v_c
        value_template: "{{ value_json.grid_v_c }}"
        availability: "{{ value_json is defined and value_json.grid_v_c is not none }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
      - name: "Deye Частота мережі"
        unique_id: deye_grid_hz
        value_template: "{{ value_json.grid_hz }}"
        availability: "{{ value_json is defined and value_json.grid_hz is not none }}"
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
      - name: "Deye Вік даних"
        unique_id: deye_data_age_s
        value_template: "{{ value_json.data_age_s }}"
        unit_of_measurement: "s"
        device_class: duration
        state_class: measurement
      - name: "Deye Спожито за годину"
        unique_id: deye_last_hour_load_kwh
        value_template: "{{ value_json.last_hour_load_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
      - name: "Deye Спожито сьогодні"
        unique_id: deye_today_load_kwh
        value_template: "{{ value_json.today_load_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
      - name: "Deye Сонце сьогодні"
        unique_id: deye_today_pv_kwh
        value_template: "{{ value_json.today_pv_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
      - name: "Deye З мережі сьогодні"
        unique_id: deye_today_grid_import_kwh
        value_template: "{{ value_json.today_grid_import_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
      - name: "Deye Автономність сьогодні"
        unique_id: deye_today_self_sufficiency
        value_template: "{{ value_json.today_self_sufficiency }}"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "Deye Спожито всього"
        unique_id: deye_total_load_kwh
        value_template: "{{ value_json.total_load_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Deye Спожито фаза A всього"
        unique_id: deye_total_load_a_kwh
        value_template: "{{ value_json.total_load_a_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Deye Спожито фаза B всього"
        unique_id: deye_total_load_b_kwh
        value_template: "{{ value_json.total_load_b_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Deye Спожито фаза C всього"
        unique_id: deye_total_load_c_kwh
        value_template: "{{ value_json.total_load_c_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Deye Сонце всього"
        unique_id: deye_total_pv_kwh
        value_template: "{{ value_json.total_pv_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Deye З мережі всього"
        unique_id: deye_total_grid_import_kwh
        value_template: "{{ value_json.total_grid_import_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Deye Батарея заряджено всього"
        unique_id: deye_total_batt_charge_kwh
        value_template: "{{ value_json.total_batt_charge_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Deye Батарея віддала всього"
        unique_id: deye_total_batt_discharge_kwh
        value_template: "{{ value_json.total_batt_discharge_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Deye Прогноз"
        unique_id: deye_headline
        value_template: "{{ value_json.headline }}"
        icon: mdi:message-text-outline
      - name: "Deye Прогноз деталі"
        unique_id: deye_headline_detail
        value_template: "{{ value_json.headline_detail }}"
        availability: "{{ value_json is defined and value_json.headline_detail is not none }}"
        icon: mdi:text
      - name: "Deye Прогноз тон"
        unique_id: deye_headline_tone
        value_template: "{{ value_json.headline_tone }}"
        icon: mdi:traffic-light
      - name: "Deye Прогноз на основі"
        unique_id: deye_confidence
        value_template: "{{ value_json.confidence }}"
        icon: mdi:calendar-question
      - name: "Deye Батареї вистачить"
        unique_id: deye_battery_runtime_h
        value_template: "{{ value_json.battery_runtime_h }}"
        availability: "{{ value_json is defined and value_json.battery_runtime_h is not none }}"
        unit_of_measurement: "h"
        device_class: duration
        state_class: measurement
      - name: "Deye Батарея сяде"
        unique_id: deye_battery_empty_at
        value_template: "{{ value_json.battery_empty_at }}"
        availability: "{{ value_json is defined and value_json.battery_empty_at is not none }}"
        device_class: timestamp
      - name: "Deye Батарея повна о"
        unique_id: deye_battery_full_at
        value_template: "{{ value_json.battery_full_at }}"
        availability: "{{ value_json is defined and value_json.battery_full_at is not none }}"
        device_class: timestamp
      - name: "Deye Світло повернеться"
        unique_id: deye_outage_expected_end
        value_template: "{{ value_json.outage_expected_end }}"
        availability: "{{ value_json is defined and value_json.outage_expected_end is not none }}"
        device_class: timestamp
      - name: "Deye Заряд після відключення"
        unique_id: deye_outage_end_soc
        value_template: "{{ value_json.outage_end_soc }}"
        availability: "{{ value_json is defined and value_json.outage_end_soc is not none }}"
        unit_of_measurement: "%"
        device_class: battery
      - name: "Deye Наступне відключення"
        unique_id: deye_next_outage_start
        value_template: "{{ value_json.next_outage_start }}"
        availability: "{{ value_json is defined and value_json.next_outage_start is not none }}"
        device_class: timestamp
      - name: "Deye Наступне відключення кінець"
        unique_id: deye_next_outage_end
        value_template: "{{ value_json.next_outage_end }}"
        availability: "{{ value_json is defined and value_json.next_outage_end is not none }}"
        device_class: timestamp
      - name: "Deye Заряд після наступного відключення"
        unique_id: deye_next_outage_end_soc
        value_template: "{{ value_json.next_outage_end_soc }}"
        availability: "{{ value_json is defined and value_json.next_outage_end_soc is not none }}"
        unit_of_measurement: "%"
        device_class: battery
      - name: "Deye Треба зменшити споживання"
        unique_id: deye_cut_w_needed
        value_template: "{{ value_json.cut_w_needed }}"
        availability: "{{ value_json is defined and value_json.cut_w_needed is not none }}"
        unit_of_measurement: "W"
        device_class: power
      - name: "Deye Графік сьогодні"
        unique_id: deye_schedule_today
        value_template: "{{ value_json.schedule_today }}"
        availability: "{{ value_json is defined and value_json.schedule_today is not none }}"
        icon: mdi:calendar-today
      - name: "Deye Графік завтра"
        unique_id: deye_schedule_tomorrow
        value_template: "{{ value_json.schedule_tomorrow }}"
        availability: "{{ value_json is defined and value_json.schedule_tomorrow is not none }}"
        icon: mdi:calendar-arrow-right
      - name: "Deye Розбіжність з графіком"
        unique_id: deye_schedule_mismatch
        value_template: "{{ value_json.schedule_mismatch }}"
        availability: "{{ value_json is defined and value_json.schedule_mismatch is not none }}"
        icon: mdi:alert-outline
      - name: "Deye Генератор сусідів сьогодні"
        unique_id: deye_generator_today
        value_template: "{{ value_json.generator_today }}"
        availability: "{{ value_json is defined and value_json.generator_today is not none }}"
        icon: mdi:engine
      - name: "Deye Генератор сусідів з"
        unique_id: deye_generator_next_start
        value_template: "{{ value_json.generator_next_start }}"
        availability: "{{ value_json is defined and value_json.generator_next_start is not none }}"
        device_class: timestamp
      - name: "Deye Прогноз сонця сьогодні"
        unique_id: deye_sun_forecast_today_kwh
        value_template: "{{ value_json.sun_forecast_today_kwh }}"
        availability: "{{ value_json is defined and value_json.sun_forecast_today_kwh is not none }}"
        unit_of_measurement: "kWh"
        device_class: energy
      - name: "Deye Прогноз сонця до кінця дня"
        unique_id: deye_sun_forecast_rest_kwh
        value_template: "{{ value_json.sun_forecast_rest_kwh }}"
        availability: "{{ value_json is defined and value_json.sun_forecast_rest_kwh is not none }}"
        unit_of_measurement: "kWh"
        device_class: energy
      - name: "Deye Прогноз сонця завтра"
        unique_id: deye_sun_forecast_tomorrow_kwh
        value_template: "{{ value_json.sun_forecast_tomorrow_kwh }}"
        availability: "{{ value_json is defined and value_json.sun_forecast_tomorrow_kwh is not none }}"
        unit_of_measurement: "kWh"
        device_class: energy
      - name: "Deye Потреба за добу"
        unique_id: deye_need_today_kwh
        value_template: "{{ value_json.need_today_kwh }}"
        availability: "{{ value_json is defined and value_json.need_today_kwh is not none }}"
        unit_of_measurement: "kWh"
        device_class: energy
