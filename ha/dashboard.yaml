# Paste into: Settings → Dashboards → Add dashboard → (open it) → ⋮ → Edit → ⋮ → Raw configuration editor.
# Generated by ha/make_package.py. Entity ids follow HA's naming of the sensors in deye.yaml.
title: Інвертор
views:
  - title: Зараз
    path: deye
    icon: mdi:solar-power-variant
    cards:
      - type: markdown
        content: |
          ## {{ states('sensor.deye_prognoz') }}
          {{ states('sensor.deye_prognoz_detali') if states('sensor.deye_prognoz_detali') not in ['unknown','unavailable'] else '' }}
          {% if states('sensor.deye_rozbizhnist_z_grafikom') not in ['unknown','unavailable'] %}
          ⚠️ {{ states('sensor.deye_rozbizhnist_z_grafikom') }}
          {% endif %}
          {% if states('sensor.deye_generator_susidiv_sogodni') not in ['unknown','unavailable'] %}
          <small>генератор сусідів: {{ states('sensor.deye_generator_susidiv_sogodni') }}</small>
          {% endif %}
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.deye_batareia
            name: Батарея
            min: 0
            max: 100
            needle: true
            severity: { green: 40, yellow: 20, red: 0 }
          - type: entities
            entities:
              - entity: binary_sensor.deye_svitlo
                name: Світло
              - entity: sensor.deye_spozhivannia
                name: Дім
              - entity: sensor.deye_sontse
                name: Сонце
              - entity: sensor.deye_batareia_potuzhnist
                name: Батарея (+ розряд)
              - entity: sensor.deye_z_merezhi
                name: Мережа
      - type: entities
        title: Фази
        entities:
          - entity: sensor.deye_spozhivannia_faza_a
            name: "Фаза A"
          - entity: sensor.deye_spozhivannia_faza_b
            name: "Фаза B"
          - entity: sensor.deye_spozhivannia_faza_c
            name: "Фаза C"
          - entity: sensor.deye_spozhito_za_godinu
            name: "За останню годину"
          - entity: sensor.deye_spozhito_sogodni
            name: "Сьогодні"
      - type: entities
        title: План
        entities:
          - entity: sensor.deye_nastupne_vidkliuchennia
            name: "Наступне відключення"
          - entity: sensor.deye_nastupne_vidkliuchennia_kinets
            name: "до"
          - entity: sensor.deye_zariad_pislia_nastupnogo_vidkliuchennia
            name: "Заряд після нього"
          - entity: sensor.deye_svitlo_povernetsia
            name: "Світло повернеться"
          - entity: sensor.deye_batareia_siade
            name: "Батарея сяде (песимістично)"
          - entity: sensor.deye_batareia_povna_o
            name: "Батарея повна о"
          - entity: sensor.deye_treba_zmenshiti_spozhivannia
            name: "Зменшити споживання на"
          - entity: sensor.deye_grafik_sogodni
            name: "Графік сьогодні"
          - entity: sensor.deye_grafik_zavtra
            name: "Графік завтра"
      - type: entities
        title: Сонце
        entities:
          - entity: sensor.deye_sontse_sogodni
            name: "Сьогодні вже"
          - entity: sensor.deye_prognoz_sontsia_do_kintsia_dnia
            name: "Прогноз до кінця дня"
          - entity: sensor.deye_prognoz_sontsia_zavtra
            name: "Прогноз на завтра"
          - entity: sensor.deye_potreba_za_dobu
            name: "Потреба за добу"
          - entity: sensor.deye_avtonomnist_sogodni
            name: "Автономність сьогодні"
      - type: history-graph
        title: Потужність, 24 год
        hours_to_show: 24
        entities:
          - entity: sensor.deye_spozhivannia
            name: "Дім"
          - entity: sensor.deye_sontse
            name: "Сонце"
          - entity: sensor.deye_batareia_potuzhnist
            name: "Батарея"
      - type: history-graph
        title: Заряд і світло, 48 год
        hours_to_show: 48
        entities:
          - entity: sensor.deye_batareia
            name: "Батарея"
          - entity: binary_sensor.deye_svitlo
            name: Світло
      - type: statistics-graph
        title: Споживання по фазах за днями
        chart_type: bar
        period: day
        days_to_show: 14
        stat_types: [change]
        entities:
          - entity: sensor.deye_spozhito_faza_a_vsogo
            name: "Фаза A"
          - entity: sensor.deye_spozhito_faza_b_vsogo
            name: "Фаза B"
          - entity: sensor.deye_spozhito_faza_c_vsogo
            name: "Фаза C"
      - type: statistics-graph
        title: Сонце і мережа за днями
        chart_type: bar
        period: day
        days_to_show: 14
        stat_types: [change]
        entities:
          - entity: sensor.deye_sontse_vsogo
            name: "Сонце"
          - entity: sensor.deye_z_merezhi_vsogo
            name: "З мережі"
